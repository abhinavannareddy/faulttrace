[project]
name = "faulttrace"
dynamic = ["version"]
description = "Root-cause diagnosis from diagnostic trouble codes, with simulation-based verification and an inspection plan"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Abhinav Annareddy" }]
dependencies = ["networkx>=3", "langgraph>=0.2", "fastapi>=0.110", "pydantic>=2.6", "pyyaml>=6", "uvicorn>=0.29"]

[project.scripts]
faulttrace = "faulttrace.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "faulttrace.__version__" }

[tool.setuptools.packages.find]
include = ["faulttrace*"]

[tool.ruff]
line-length = 130
target-version = "py312"
