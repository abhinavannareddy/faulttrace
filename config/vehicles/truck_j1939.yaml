  p: 0.9
- from: abs_ecu
  to: brakes
  p: 0.9
- from: engine_ecu
  to: aftertreatment
  p: 0.9
- from: can_backbone
  to: dashboard
  p: 0.9
- from: body_ecu
  to: lighting
  p: 0.9
- from: maf_sensor
  to: engine_ecu
  p: 0.9
