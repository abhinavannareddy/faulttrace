vehicle: excavator
synthetic: true
components:
- id: battery
  system: power
  service:
    action: Measure supply voltage and ground drop under load; inspect fuses, terminals
      and connectors
    minutes: 40
- id: alternator
  system: power
  service:
    action: Measure supply voltage and ground drop under load; inspect fuses, terminals
      and connectors
    minutes: 40
- id: power_dist
  system: power
  service:
    action: Measure supply voltage and ground drop under load; inspect fuses, terminals
      and connectors
    minutes: 40
- id: can_backbone
  system: network
  service:
    action: Check bus termination and wiring resistance; look for a node that is holding
      the bus down
    minutes: 60
- id: engine_ecu
  system: powertrain
  service:
    action: Read freeze-frame data, check supply and ground, then reflash or replace
      the control unit
    minutes: 45
- id: body_ecu
  system: body
  service:
    action: Check the module's supply, its connector and the fuse before replacing
      it
    minutes: 25
- id: hydraulic_pump
  system: hydraulics
  service:
    action: Check pressure at the test port and inspect hoses and fittings for leaks
    minutes: 55
- id: pump_controller
  system: hydraulics
  service:
    action: Check pressure at the test port and inspect hoses and fittings for leaks
    minutes: 55
- id: main_valve
  system: hydraulics
  service:
    action: Check pressure at the test port and inspect hoses and fittings for leaks
    minutes: 55
- id: boom_cylinder
  system: hydraulics
  service:
    action: Check pressure at the test port and inspect hoses and fittings for leaks
    minutes: 55
- id: arm_cylinder
  system: hydraulics
  service:
    action: Check pressure at the test port and inspect hoses and fittings for leaks
    minutes: 55
- id: swing_motor
  system: hydraulics
  service:
    action: Check pressure at the test port and inspect hoses and fittings for leaks
    minutes: 55
- id: oil_cooler
  system: cooling
  service:
    action: Compare the sensor reading with a reference thermometer; inspect connector
      and wiring
    minutes: 20
- id: oil_temp_sensor
  system: cooling
  service:
    action: Compare the sensor reading with a reference thermometer; inspect connector
      and wiring
    minutes: 20
- id: pressure_sensor
  system: hydraulics
  service:
    action: Check pressure at the test port and inspect hoses and fittings for leaks
    minutes: 55
- id: joystick_ecu
  system: controls
  service:
    action: Check the input device calibration, wiring and supply voltage
    minutes: 30
- id: joystick
  system: controls
  service:
    action: Check the input device calibration, wiring and supply voltage
    minutes: 30
- id: fuel_pump
  system: fuel
  service:
    action: Test supply pressure and inspect lines, filter and electrical connector
    minutes: 35
- id: injectors
  system: fuel
  service:
    action: Test supply pressure and inspect lines, filter and electrical connector
    minutes: 35
- id: cab_display
  system: body
  service:
    action: Check the module's supply, its connector and the fuse before replacing
      it
    minutes: 25
edges:
- from: alternator
  to: battery
  p: 0.9
- from: battery
  to: power_dist
  p: 0.9
- from: power_dist
  to: engine_ecu
  p: 0.9
- from: power_dist
  to: can_backbone
  p: 0.9
- from: can_backbone
  to: body_ecu
  p: 0.9
- from: can_backbone
  to: engine_ecu
  p: 0.9
- from: engine_ecu
  to: hydraulic_pump
  p: 0.9
- from: can_backbone
  to: pump_controller
  p: 0.9
- from: pump_controller
  to: hydraulic_pump
  p: 0.9
- from: hydraulic_pump
  to: main_valve
  p: 0.9
- from: main_valve
  to: boom_cylinder
  p: 0.9
- from: main_valve
  to: arm_cylinder
  p: 0.9
- from: main_valve
  to: swing_motor
  p: 0.9
- from: oil_cooler
  to: oil_temp_sensor
  p: 0.9
- from: hydraulic_pump
  to: oil_cooler
  p: 0.9
- from: power_dist
  to: pressure_sensor
  p: 0.9
- from: pressure_sensor
  to: pump_controller
  p: 0.9
- from: can_backbone
  to: joystick_ecu
  p: 0.9
- from: joystick
  to: joystick_ecu
  p: 0.9
- from: joystick_ecu
  to: main_valve
  p: 0.9
- from: power_dist
  to: fuel_pump
  p: 0.9
- from: fuel_pump
  to: injectors
  p: 0.9
- from: engine_ecu
  to: injectors
  p: 0.9
- from: can_backbone
  to: cab_display
  p: 0.9
dtcs:
- code: P0501
  component: battery
  description: battery fault or out-of-range
- code: P0601
  component: engine_ecu
  description: engine ecu fault or out-of-range
- code: P2501
  component: hydraulic_pump
  description: hydraulic pump fault or out-of-range
- code: P2502
  component: boom_cylinder
  description: boom cylinder fault or out-of-range
- code: P2503
  component: arm_cylinder
  description: arm cylinder fault or out-of-range
- code: P2504
  component: swing_motor
  description: swing motor fault or out-of-range
- code: P0001
  component: oil_cooler
  description: oil cooler fault or out-of-range
- code: P0002
  component: oil_temp_sensor
  description: oil temp sensor fault or out-of-range
- code: P2505
