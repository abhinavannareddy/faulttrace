vehicle: car
synthetic: true
components:
- id: battery
  system: power
  service:
    action: Measure supply voltage and ground drop under load; inspect fuses, terminals
      and connectors
    minutes: 40
- id: alternator
  system: power
  service:
    action: Measure supply voltage and ground drop under load; inspect fuses, terminals
      and connectors
    minutes: 40
- id: power_dist
  system: power
  service:
    action: Measure supply voltage and ground drop under load; inspect fuses, terminals
      and connectors
    minutes: 40
- id: can_backbone
  system: network
  service:
    action: Check bus termination and wiring resistance; look for a node that is holding
      the bus down
    minutes: 60
- id: engine_ecu
  system: powertrain
  service:
    action: Read freeze-frame data, check supply and ground, then reflash or replace
      the control unit
    minutes: 45
- id: body_ecu
  system: body
  service:
    action: Check the module's supply, its connector and the fuse before replacing
      it
    minutes: 25
- id: fuel_pump
  system: fuel
  service:
    action: Test supply pressure and inspect lines, filter and electrical connector
    minutes: 35
- id: injectors
  system: fuel
  service:
    action: Test supply pressure and inspect lines, filter and electrical connector
    minutes: 35
- id: throttle_body
  system: air
  service:
    action: Inspect the air path for leaks and the sensor connector; compare the reading
      with a reference
    minutes: 30
- id: o2_sensor
  system: emissions
  service:
    action: Inspect the sensor and exhaust for leaks; check heater and signal circuits
    minutes: 40
- id: ignition_coils
  system: ignition
  service:
    action: Test coil resistance and supply; check the plug and connector
    minutes: 25
- id: trans_ecu
  system: driveline
  service:
    action: Check fluid level and condition, then the module connector and harness
    minutes: 50
- id: gearbox
  system: driveline
  service:
    action: Check fluid level and condition, then the module connector and harness
    minutes: 50
- id: abs_ecu
  system: chassis
  service:
    action: Check sensor air gap, wiring and connector; test the signal with a scope
    minutes: 35
- id: wheel_speed_sensors
  system: chassis
  service:
    action: Check sensor air gap, wiring and connector; test the signal with a scope
    minutes: 35
- id: steering_ecu
  system: chassis
  service:
    action: Check sensor air gap, wiring and connector; test the signal with a scope
    minutes: 35
- id: power_steering
  system: chassis
  service:
    action: Check sensor air gap, wiring and connector; test the signal with a scope
    minutes: 35
- id: infotainment
  system: body
  service:
    action: Check the module's supply, its connector and the fuse before replacing
      it
    minutes: 25
- id: climate_ecu
  system: body
  service:
    action: Check the module's supply, its connector and the fuse before replacing
      it
    minutes: 25
- id: hvac
  system: body
  service:
    action: Check the module's supply, its connector and the fuse before replacing
      it
    minutes: 25
edges:
- from: alternator
  to: battery
  p: 0.9
- from: battery
  to: power_dist
  p: 0.9
- from: power_dist
  to: engine_ecu
  p: 0.9
- from: power_dist
  to: can_backbone
  p: 0.9
- from: can_backbone
  to: body_ecu
  p: 0.9
- from: can_backbone
  to: engine_ecu
  p: 0.9
- from: power_dist
  to: fuel_pump
  p: 0.9
- from: fuel_pump
  to: injectors
  p: 0.9
- from: engine_ecu
  to: injectors
  p: 0.9
- from: engine_ecu
  to: throttle_body
  p: 0.9
- from: o2_sensor
  to: engine_ecu
  p: 0.9
- from: power_dist
  to: o2_sensor
  p: 0.9
- from: engine_ecu
  to: ignition_coils
  p: 0.9
- from: can_backbone
  to: trans_ecu
  p: 0.9
- from: trans_ecu
  to: gearbox
  p: 0.9
- from: can_backbone
  to: abs_ecu
  p: 0.9
- from: power_dist
  to: wheel_speed_sensors
  p: 0.9
- from: wheel_speed_sensors
  to: abs_ecu
  p: 0.9
- from: can_backbone
  to: steering_ecu
  p: 0.9
- from: steering_ecu
  to: power_steering
  p: 0.9
- from: can_backbone
  to: infotainment
  p: 0.9
- from: body_ecu
  to: climate_ecu
  p: 0.9
- from: climate_ecu
  to: hvac
  p: 0.9
dtcs:
- code: P0501
  component: battery
  description: battery fault or out-of-range
- code: P0601
  component: engine_ecu
  description: engine ecu fault or out-of-range
- code: P0201
  component: fuel_pump
  description: fuel pump fault or out-of-range
- code: P0202
  component: injectors
  description: injectors fault or out-of-range
- code: P0101
  component: throttle_body
  description: throttle body fault or out-of-range
- code: P0401
  component: o2_sensor
  description: o2 sensor fault or out-of-range
- code: P0301
  component: ignition_coils
  description: ignition coils fault or out-of-range
- code: P0701
