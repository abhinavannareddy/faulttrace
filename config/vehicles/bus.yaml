  to: brake_circuit
  p: 0.9
- from: body_ecu
  to: door_ecu
  p: 0.9
- from: door_ecu
  to: doors
  p: 0.9
- from: air_dryer
  to: doors
  p: 0.9
- from: body_ecu
  to: hvac_ecu
  p: 0.9
- from: hvac_ecu
  to: hvac
  p: 0.9
- from: can_backbone
  to: trans_ecu
  p: 0.9
- from: trans_ecu
  to: transmission
  p: 0.9
- from: can_backbone
