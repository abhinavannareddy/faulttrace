  component: battery
  description: battery fault or out-of-range
- code: P0601
  component: engine_ecu
  description: engine ecu fault or out-of-range
- code: P0201
  component: fuel_pump
  description: fuel pump fault or out-of-range
- code: P0202
  component: injectors
  description: injectors fault or out-of-range
- code: P0101
